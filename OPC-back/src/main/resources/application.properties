spring.application.name=opc-back
# Server
server.port=${SERVER_PORT:8080}

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:opc_inventario}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway
spring.flyway.enabled=true

# JPA / Hibernate — Flyway es la fuente de verdad del esquema; Hibernate
# solo valida que las entidades coincidan (no crea ni modifica nada).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#JWT — access token corto (15 min) + refresh token persistido y rotado
# (7 días), ver ADR-003 en Decisiones_Arquitectura.md. Antes de que
# existiera el refresh token, jwt.expiration se dejaba en 24h porque no
# había forma de renovar la sesión sin volver a loguearse; ahora que sí la
# hay, un access token de vida corta es lo que de verdad limita el daño de
# uno filtrado.
jwt.secret=${JWT_SECRET:opcback2026JWTAplicacionSpringBoot}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${REFRESH_TOKEN_EXPIRATION:604800000}

# CORS — orígenes del frontend permitidos a llamar la API desde el navegador
# (nginx en Docker: 3000; servidor de desarrollo de Vite: 5173)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health

# Notificaciones — chequeo periódico que reconcilia las alertas de stock:
# crea las que falten, borra las cumplidas y vuelve a "sin leer" las leídas
# que siguen vigentes. Por defecto cada 2 horas entre las 7:00 y las 19:00,
# hora de Bogotá (ver NotificationReconciliationJob). El disparo instantáneo
# en cada movimiento/umbral/alta de producto es independiente de este cron.
notifications.reconciliation.cron=${NOTIFICATIONS_RECONCILIATION_CRON:0 0 7,9,11,13,15,17,19 * * *}