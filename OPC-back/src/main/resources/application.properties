spring.application.name=opc-back
# Server
server.port=${SERVER_PORT:8080}

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:opc_inventario}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway
spring.flyway.enabled=true

# JPA / Hibernate — Flyway es la fuente de verdad del esquema; Hibernate
# solo valida que las entidades coincidan (no crea ni modifica nada).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#JWT
jwt.secret=${JWT_SECRET:opcback2026JWTAplicacionSpringBoot}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS — orígenes del frontend permitidos a llamar la API desde el navegador
# (nginx en Docker: 3000; servidor de desarrollo de Vite: 5173)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health