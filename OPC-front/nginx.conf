server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real (ej. /dashboard, /login)
    # cae de vuelta a index.html — React Router resuelve la ruta en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
