services:
  mysql:
    # "latest" apunta hoy a la release de innovación más reciente de MySQL (9.x/26.x).
    # Si prefieres la línea LTS (más estable, recomendada para no reconstruir el
    # esquema cada vez que Oracle publica una innovation release), cambia a: mysql:lts
    image: mysql:latest
    container_name: opc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opc_inventario}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Bogota
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./OPC-back
      dockerfile: Dockerfile
    container_name: opc-backend
    restart: unless-stopped
    environment:
      # Sin esto el contenedor corre en UTC (default de la imagen base) y
      # LocalDateTime.now() (fecha real de despacho/llegada, eventos, etc.)
      # queda 5 horas adelantada respecto a la hora local del negocio —
      # rompe cualquier comparación contra una fecha que el usuario escribe
      # en un <input type="datetime-local"> (esa sí es hora local, sin
      # conversión). Las columnas son DATETIME (no TIMESTAMP), así que
      # MySQL no aplica ninguna conversión propia — el ajuste va aquí.
      TZ: ${APP_TIMEZONE:-America/Bogota}
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-opc_inventario}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-604800000}
      SHOW_SQL: ${SHOW_SQL:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./OPC-front
      dockerfile: Dockerfile
      args:
        # Debe ser una URL alcanzable desde el navegador del usuario, no el
        # nombre del servicio Docker — el navegador corre fuera de la red
        # interna de Compose, así que "http://backend:8080" no funcionaría.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: opc-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
